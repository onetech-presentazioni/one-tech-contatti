name: Publish ONE Tech shared list
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: one-tech-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build shared register from GitHub updates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {applyIssue} = require(process.cwd()+'/scripts/reduce-issues.cjs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo,state:'all',per_page:100,sort:'created',direction:'asc'});
            issues.sort((a,b)=>a.number-b.number);
            const state = {work:{},entries:{},generatedAt:new Date().toISOString()};
            for(const issue of issues) applyIssue(state,issue);
            fs.mkdirSync('_site',{recursive:true});
            for(const name of fs.readdirSync('.')) if(/\.(html|json|txt)$/.test(name)) fs.copyFileSync(name,'_site/'+name);
            fs.writeFileSync('_site/shared-state.json',JSON.stringify(state));
            fs.writeFileSync('_site/.nojekyll','');
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
